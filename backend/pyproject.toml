[project]
name = "projectalma-backend"
version = "0.1.0"
description = "Lead management API — public lead intake + auth-guarded internal review UI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.12",
    "PyJWT>=2.10",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2,<5",
    "resend>=2.5",
    "aiofiles>=24.1",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-aiofiles",
    "types-passlib",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
omit = ["app/main.py", "alembic/*", "scripts/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["UP042"]  # keep `str, Enum` for broad JSON-serialization compatibility

[tool.ruff.lint.per-file-ignores]
"app/templates/email/messages.py" = ["E501"]  # inline HTML strings
"alembic/env.py" = ["F401", "F403", "E402"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["alembic/", "tests/"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
