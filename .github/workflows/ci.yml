name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: projectalma
          POSTGRES_PASSWORD: projectalma
          POSTGRES_DB: projectalma
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U projectalma"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://projectalma:projectalma@localhost:5432/projectalma
      SECRET_KEY: ci-secret-ci-secret-ci-secret-ci-secret-xx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e .
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check
        run: mypy app
      - name: Migrations apply & roll back cleanly
        run: alembic upgrade head && alembic downgrade base
      - name: Tests (SQLite, in-memory)
        run: pytest -q
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///:memory:

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          API_BASE_URL: http://localhost:8000/api/v1
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
